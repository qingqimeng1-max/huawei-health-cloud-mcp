services:
  huawei-health-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 只绑本机，对外走反向代理 HTTPS + 鉴权
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      KEY_DIR: /keys            # 密钥与数据库分离挂载，不要备份到一起
      SYNC_INTERVAL_HOURS: 2
    volumes:
      - ./data:/data            # SQLite 落盘，权限 600
      - ./keys:/keys            # 加密密钥独立 volume，权限 600
